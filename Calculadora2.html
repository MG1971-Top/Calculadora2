<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Precios 💰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .result {
      font-size: 1.5rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card p-4 animate__animated animate__fadeInUp" style="max-width: 500px; width: 100%;">
    <h3 class="text-center mb-4">🧮 Calculadora de Precios</h3>
    <div class="mb-3">
      <label for="cost" class="form-label">Costo base del producto ($)</label>
      <input type="number" class="form-control" id="cost" placeholder="Ej. 100">
    </div>
    <div class="mb-3">
      <label for="profit" class="form-label">Porcentaje de ganancia (%)</label>
      <input type="number" class="form-control" id="profit" placeholder="Ej. 40">
    </div>
    <div class="d-grid">
      <button class="btn btn-success" onclick="calcularPrecio()">Calcular 💡</button>
    </div>

    <div id="resultado" class="text-center result animate__animated" style="display: none;">
      <!-- Aquí se mostrará el resultado -->
    </div>
  </div>

  <script>
    function calcularPrecio() {
      const cost = parseFloat(document.getElementById('cost').value);
      const profit = parseFloat(document.getElementById('profit').value);
      const resultadoDiv = document.getElementById('resultado');

      if (isNaN(cost) || isNaN(profit) || cost < 0 || profit < 0) {
        resultadoDiv.innerHTML = "⚠️ Ingresa valores válidos.";
        resultadoDiv.className = "text-center result animate__animated animate__shakeX text-danger";
        resultadoDiv.style.display = "block";
        return;
      }

      const ganancia = cost * (profit / 100);
      const precioFinal = cost + ganancia;

      resultadoDiv.innerHTML = `
        <div class="text-success">
          <p>💸 <strong>Precio final sugerido:</strong> $${precioFinal.toFixed(2)}</p>
          <p>📈 <strong>Ganancia:</strong> $${ganancia.toFixed(2)}</p>
        </div>
      `;
      resultadoDiv.className = "text-center result animate__animated animate__fadeInUp";
      resultadoDiv.style.display = "block";
    }
  </script>

</body>
</html>
